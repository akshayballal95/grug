[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grug"
version = "0.1.0"
description = "Compress documents into terse caveman-style text to cut LLM input tokens."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "grug contributors" }]
keywords = ["llm", "prompt", "compression", "tokens", "llmlingua"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "typer>=0.12",
  # CommonMark parser used for markdown-aware chunking. Already pulled in by
  # typer -> rich, so declaring it adds nothing to an install.
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
lingua2 = [
  "llmlingua>=0.2.1",
  "torch>=2.0",
  "transformers>=4.36",
  "accelerate>=0.26",
]
tokens = ["tiktoken>=0.5"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "tiktoken>=0.5",
]

[project.urls]
Homepage = "https://github.com/grug-tools/grug"
Issues = "https://github.com/grug-tools/grug/issues"

[project.scripts]
grug = "grug.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/grug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests that load ML models or download weights (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]
# Used deliberately in user-facing output: "132 → 78 tokens", "'not' (3× → 0×)",
# and in the punctuation grug strips off a word before comparing it.
allowed-confusables = ["\u00d7", "\u2192", "\u2018", "\u2019", "\u2013"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
